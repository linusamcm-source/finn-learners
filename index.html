<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the page paint under the notch; the CSS then
         pads content back out with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>learner-dash</title>

    <meta name="description" content="Adaptive Tasmanian road-rules practice for a learner driver" />
    <meta name="theme-color" content="#f4f5f2" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS home-screen install. Safari ignores the manifest's display mode,
         so apple-mobile-web-app-capable is what gives a standalone window,
         and apple-touch-icon is what it uses for the icon. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="learner-dash" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
